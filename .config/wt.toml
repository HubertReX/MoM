# Konfiguracja worktrunk (wt) dla MoM.
#
# Nowy worktree ma tylko pliki śledzone przez gita - bez .venv gra się nie
# uruchomi, a direnv (`layout uv` z .envrc) budowałby środowisko od zera przy
# każdym `wt switch --create`.

# Podlinkuj środowisko z głównego worktree (.venv, node_modules, kod wtyczek
# Obsidiana) i skopiuj lokalne, nieśledzone ustawienia.
#
# pre-start (nie post-start), bo direnv ładuje .envrc zaraz po `cd`, a
# post-start leci w tle - venv musi już wtedy istnieć.
pre-start = "scripts/wt_bootstrap_worktree.sh {{ primary_worktree_path }}"

# Indeks CodeGraph - jedyna rzecz, której nie da się podlinkować (baza trzyma
# bezwzględne ścieżki). Buduje się w tle, bo trwa i nic od niej nie zależy.
# Log: `wt config state logs`.
post-start = "scripts/wt_codegraph_index.sh"
