# Blunderhaven V3 - mapa o 50% węższa i o 25% niższa od V2 (256x128 -> 128x96).
#
# Trzy zmiany wobec V2:
#   1. mniej domów, proporcjonalnie do powierzchni (12288 kafli to 37,5% z 32768),
#   2. trakt faluje NIEREGULARNIE - amplitudy 4..18 kafli, okresy 9..16, zamiast
#      równego zygzaka o stałym skoku,
#   3. po wschodniej stronie trakt zawija prawie pełną pętlę wokół centrum wsi
#      i dopiero ogonem skręca na wschód, do krańca mapy.
#
# Pętla przecina samą siebie raz - i musi. Droga wchodzi w pierścień od zachodu,
# obiega go w ~340 stopniach i kończy tuż obok wjazdu; wyjście na wschód nie ma
# wtedy innej drogi niż przez pierścień. Skrzyżowanie wypada prawie prostopadle
# w okolicy (110, 62), więc czyta się jak rozstaje, a nie jak pomyłka.

name = "BLUNDERHAVEN_V3"
size = [128, 96]
seed = 20260823
base = "grass"
particles = "leafs,rain"

# === DROGI ===================================================================
[[road]]
name = "main"
width = 4
terrain = "dirt"
points = [
  # falowanie ze wschodu na zachód: amplituda i okres zmieniają się co odcinek
  [0, 64], [10, 58], [22, 67], [38, 49], [49, 56], [59, 43], [68, 47],
  # pętla, przeciwnie do wskazówek zegara: NW -> N -> NE -> E -> SE -> S -> SW -> W
  [78, 40], [92, 34], [106, 40], [113, 54], [106, 68], [92, 74], [78, 68], [72, 56],
  # ogon: skręt na wschód, przez wnętrze pętli i dalej do krańca mapy
  [84, 58], [97, 62], [109, 64], [120, 60], [127, 57],
]

