width = 2
points = [[128, 168], [104, 168], [80, 166]]

[plaza]
at = [128, 168]
radius = [12, 9]

# === POLA ====================================================================
# Regularna kratka JEST tu zamierzona: pole uprawne to jedyne miejsce, gdzie
# symetria czyta się jako praca ludzi, a nie jako lenistwo generatora.
[[fields]]
rect = [42, 38, 176, 92]
stamp = "field_crop"
plot = [4, 3]     # zagon = 4x3 klocki, czyli 24x24 kafle
gap = 3           # szerokość miedzy między zagonami

