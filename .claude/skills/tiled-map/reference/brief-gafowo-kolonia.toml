# Gafowo Kolonia 256x256 - brief odwzorowujący prompt autora:
#
#   "wioska 256x256, ze wschodu na zachód wije się szerokimi łukami droga.
#    Po obu stronach drogi wiejskie domy z zagrodami. W centralnym miejscu
#    owalny plac. Na północnym krańcu placu Tawerna, obok mała stajnia.
#    Na środku placu studnia (miejsce spotkań) ze ścieżkami w 4 strony świata.
#    Na północ od zabudowań połacie symetrycznych pól przecinanych drogami.
#    Mapę dookoła ogranicza gęsty las. Jedynymi wejściami są oba końce drogi."
#
# Do tego wymagania fabuły (reference/lore.md): gracz budzi się w stajni (Q00),
# chałupa Zielarki na końcu wioski przy lesie (Q01_S02).

name = "BLUNDERHAVEN_V2"
size = [256, 256]
seed = 20260821
base = "grass"
particles = "leafs,rain"

# === DROGI ===================================================================
# Trakt główny: szerokie łuki ze wschodu na zachód, w południowej połowie mapy,
# żeby na północy zmieściły się pola.
[[road]]
name = "main"
width = 4
terrain = "dirt"
points = [[0, 166], [38, 152], [76, 182], [114, 158], [152, 186], [192, 158], [230, 174], [255, 164]]

# Cztery ścieżki od studni w strony świata. Północna dobija do siatki pól,
# więc pola są połączone z wioską, a nie odcięte.
[[road]]
name = "well_n"
width = 2
points = [[128, 168], [128, 148], [128, 128]]

[[road]]
name = "well_s"
width = 2
points = [[128, 168], [128, 190], [128, 208]]

[[road]]
name = "well_e"
width = 2
points = [[128, 168], [152, 168], [176, 170]]

[[road]]
