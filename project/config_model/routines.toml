# Rutyny NPC - rytm dnia wspólny dla wielu postaci.
#
# Ten plik trzyma SAME rutyny. O tym kto używa którą rutyną, mówi kolumna `routine`
# w `characters.csv` - obok kolumn `home`/`work`/`social`/`hobby`, z którymi
# rutyna i tak współpracuje. Dzięki temu cały "kto, co, gdzie" jednej postaci
# czyta się z jednego wiersza. Pusta komórka = brak rutyny (stara krzywej
# z warstwy `waypoints` na mapie Tiled).
#
# `at` ma trzy warianty:
#   type:<typ>       -> kolumna `home`/`work`/`social`/`hobby` w characters.csv
#                       wskazuje nazwę obiektu z warstwy `places` w Tiled.
#                       To on czyni rutynę uniwersalną - każda postać idzie
#                       "do swojego" miejsca danego typu.
#   location:<nazwa> -> wprost nazwa obiektu z warstwy `places` (wyjątki,
#                       miejsca wspolne dla wszystkich)
#   route:<nazwa>    -> nazwana krzywej z istniejacej warstwy `waypoints`
#
# Kolejność wykonania bierze się z pola `from`, nie z kolejnosci w pliku.
# Przestawienie bloków ani dopisanie kroku w środku niczego nie psuje.
#
# Pusta komórka destynacji w `characters.csv` nie jest bledem: taki krok
# degraduje sie do "zostań gdzie jesteś", a nie do wyjatku. Dzięki temu
# niekompletne dane nigdy nie wywalają gry i nie trzeba mapować całej wioski
# na raz.
#
# `emotes` (opcjonalne) - emoji, ktore postac moze pokazac nad glowa NA TYM KROKU.
# Emoji opisuje konkretny krok dnia, wiec mieszka w tym kroku, a nie w osobnej
# tabeli `activity -> emoji`: `stand` znaczy "stoi" i tyle, wiec barman za barem,
# kowal przy kowadle i Bart przy straganie maja ten sam `activity`, a to trzy
# rozne obrazki. Brak pola = brak emoji, i to nie jest blad.
#
# Wariant `_anim` wpisuje sie WPROST, jako osobny element - dzieki temu czestosc
# steruje sama lista (["food", "food", "food_anim"] to jeden na trzy), zamiast
# stalym progiem zaszytym w kodzie. Emoji leci co 40-90 s, w losowanym momencie,
# zeby wies nie tykala jak zegarek.
#
# Nazwa spoza `EMOTE_SHEET_DEFINITION` (settings.py) jest ODRZUCANA przy wczytaniu,
# z ostrzezeniem w konsoli - literowka `zzz_animm` nie ma prawa byc cicha.
# Wyjatek: `food` i `sweat` to nazwy, ktorych arkusz jeszcze nie ma, a ktore juz
# wolno pisac - rozwiazuja sie na istniejace przez `settings.EMOTE_FALLBACKS`,
# a gdy autor dorysuje sprite'y, wpis stamtad znika i nic sie tu nie zmienia.

[defaults]
wander_radius       = 2     # promien mikro-wędrowki, w kaflach
slot_jitter_minutes = 20    # +/- czasu 'from', deterministycznie z hasha nazwy NPC
transit_minutes     = 15    # minuty gry od przejscia przez drzwi do pojawienia sie po
                            # drugiej stronie (v5). NPC najpierw dochodzi do drzwi na
                            # oczach gracza (dowolnie dlugo), potem znika, a po tylu
                            # minutach jest przy celu na drugiej mapie. ~1 s realne.


# =====================================================================
#  townsfolk - kupiec, kowal, barman: dom, praca, lunch, praca, dom
# =====================================================================

[[routine.townsfolk.slot]]
from     = "06:30"
at       = "type:home"
activity = "wander"

[[routine.townsfolk.slot]]
from     = "08:00"
at       = "type:work"
activity = "stand"
emotes   = ["sweat", "star", "dots"]

# Lunch w tawernie

[[routine.townsfolk.slot]]
from     = "13:00"
at       = "type:social"
activity = "wander"
emotes   = ["food", "food", "food_anim", "happy"]

[[routine.townsfolk.slot]]
from     = "16:00"
at       = "type:work"
activity = "stand"

# czas na hobby

[[routine.townsfolk.slot]]
from     = "18:30"
at       = "type:hobby"
activity = "wander"
emotes   = ["happy", "star", "smile"]

[[routine.townsfolk.slot]]
from     = "20:00"
at       = "type:home"
activity = "sleep"
emotes   = ["zzz", "zzz_anim"]

# =====================================================================
#  barman - nie przerywa pracy w porze lunchu
# =====================================================================

[[routine.barman.slot]]
from     = "06:30"
at       = "location:LOST_CORK_TAVERN:bedroom"
activity = "wander"

[[routine.barman.slot]]
from     = "08:00"
at       = "type:work"
activity = "stand"

# sprząta stoły przed lunchem

[[routine.barman.slot]]
from     = "12:00"
at       = "location:LOST_CORK_TAVERN:tables"
activity = "wander"
emotes   = ["sweat", "dots"]

[[routine.barman.slot]]
from     = "13:30"
at       = "type:work"
activity = "stand"

# sprząta stoły na koniec dnia

[[routine.barman.slot]]
from     = "19:00"
at       = "location:LOST_CORK_TAVERN:tables"
activity = "wander"

[[routine.barman.slot]]
from     = "21:00"
at       = "type:home"
activity = "sleep"
emotes   = ["zzz", "zzz_anim"]


# =====================================================================
#  farmer - wstaje przed świtem, długa praca w polu, wczesniej śpi
# =====================================================================

[[routine.farmer.slot]]
from     = "05:30"
at       = "type:work"
activity = "wander"
emotes   = ["sweat", "sweat", "star"]

[[routine.farmer.slot]]
from     = "11:00"
at       = "location:BLUNDERHAVEN:well"      # wspólna studnia, nie "swoja" - stad location:
activity = "idle"

[[routine.farmer.slot]]
from     = "12:00"
at       = "type:work"
activity = "stand"

[[routine.farmer.slot]]
from     = "18:00"
at       = "type:social"
activity = "wander"

[[routine.farmer.slot]]
from     = "21:00"
at       = "type:home"
activity = "sleep"
emotes   = ["zzz", "zzz_anim"]


# =====================================================================
#  guard - patrol dzienny, patrol wieczorny, krotka noc
# =====================================================================

[[routine.guard.slot]]
from     = "06:00"
at       = "route:ROBIN"
activity = "patrol"

[[routine.guard.slot]]
from     = "18:00"
at       = "route:ROB"
activity = "patrol"

[[routine.guard.slot]]
from     = "02:00"
at       = "type:home"
activity = "sleep"
emotes   = ["zzz", "zzz_anim"]

# Rutyny `farmer` i `guard` nie maja dziś żadnej obsady - są gotowymi
# szablonami na postacie, których na mapie jeszcze nie ma. Żeby którąś
# obsadzic, wpisz jej klucz w kolumnie `routine` w `characters.csv`.
